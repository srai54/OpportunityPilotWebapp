<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head>
<body>
<title>OpportunityPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* OpportunityPilot redesign v6 — built on the repo's own src/styles/tokens.css.
   Token names and values are copied verbatim so a component can lift these rules directly.
   Layout: Simple = one centred column, no rail (DESIGN.md §5). Advanced = 236px rail + wide pages. */
:root{
  color-scheme: light;
  --op-bg:#fbfaf9; --op-surface:#ffffff; --op-panel-head:#f6f5f4; --op-raised:#ffffff;
  --op-nav:#f7f6f3; --op-nav-active:#ebeae8; --op-nav-border:#e6e4e1; --op-nav-ink:#55524e;
  --op-nav-ink-strong:#37352f; --op-nav-ink-muted:#6b6762; --op-nav-badge:#e4a93c; --op-on-nav-badge:#2a1d00;
  --op-ink:#31302e; --op-muted:#615d59; --op-faint:#8a857f;
  --op-line:#e6e6e6; --op-hair:#efeeed; --op-field-border:#d9d6d2; --op-field-bg:#ffffff;
  --op-primary:#006dd0; --op-on-primary:#ffffff; --op-primary-hover:#005bab;
  --op-primary-tint:#e8f2fc; --op-primary-tint-border:#b9d8f5; --op-on-primary-tint:#005bab; --op-focus:#0075de;
  --op-neutral-tint:#f1f0ee; --op-on-neutral-tint:#4a4743;
  --op-teal-tint:#e3f1f0;    --op-on-teal-tint:#1d6b68;
  --op-green-tint:#e6f3ea;   --op-on-green-tint:#13603a;
  --op-amber-tint:#fbf1dc;   --op-on-amber-tint:#7a4f00;
  --op-danger-tint:#fbeaec;  --op-on-danger-tint:#8f2129;
  --op-indigo-tint:#e8eefa;  --op-on-indigo-tint:#27478a;
  --op-banner-bg:#fdf7e8; --op-banner-border:#f0dfb4; --op-banner-ink:#6f4a00; --op-banner-icon:#8a5a00;
  --op-ai-bg:#f5f3fa; --op-ai-border:#ddd6ee; --op-ai-ink:#2f2a4d; --op-ai-badge:#4b3f86;
  --op-ws-candidate:#0075de; --op-ws-sales:#dd5b00;
  --op-c1:#0075de; --op-c2:#a66400; --op-c3:#2a9d99; --op-c4:#9b3a6a;
  --op-chart-track:#f1f0ee; --op-chart-grid:#efeeed; --op-skeleton:#efeeed; --op-overlay:rgba(16,30,48,.46);
  --op-shadow-raised:0 2px 8px rgb(0 0 0 / .15);
  --op-shadow-card:0 1px 2px rgb(22 37 58 / .05), 0 2px 8px rgb(22 37 58 / .04);
  --op-shadow-hover:0 4px 16px rgb(22 37 58 / .10);
  --op-shadow-popover:0 8px 24px rgb(22 37 58 / .12);
  --op-shadow-sticky:0 -4px 12px rgb(22 37 58 / .06);
  --op-radius:12px; --op-radius-card:16px; --op-radius-control:8px; --op-radius-chip:6px;
  --op-ease-out:cubic-bezier(.23,1,.32,1); --op-ease-in-out:cubic-bezier(.77,0,.175,1);
  --op-font:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --op-font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --op-text-page:24px; --op-text-screen:16px; --op-text-metric:30px; --op-text-body:14px; --op-text-meta:12.5px; --op-text-micro:11.5px;
  --op-space-1:4px; --op-space-2:8px; --op-space-3:12px; --op-space-4:16px; --op-space-5:20px; --op-space-6:24px;
  --op-nav-width:236px; --op-header-height:52px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --op-bg:#191919; --op-surface:#202020; --op-panel-head:#252525; --op-raised:#2a2a2a;
  --op-nav:#171717; --op-nav-active:#2f2f2f; --op-nav-border:#2f2f2f; --op-nav-ink:#b4aea8;
  --op-nav-ink-strong:#ece8e3; --op-nav-ink-muted:#8f8983; --op-nav-badge:#e4ae55; --op-on-nav-badge:#2a1d00;
  --op-ink:#f1efed; --op-muted:#a8a29b; --op-faint:#8f8983;
  --op-line:#33312f; --op-hair:#2a2927; --op-field-border:#454340; --op-field-bg:#1b1b1b;
  --op-primary:#4da3f5; --op-on-primary:#04213f; --op-primary-hover:#74b8f8;
  --op-primary-tint:#16293f; --op-primary-tint-border:#24476b; --op-on-primary-tint:#9fcdfa; --op-focus:#74b8f8;
  --op-neutral-tint:#2a2927; --op-on-neutral-tint:#cbc5be;
  --op-teal-tint:#142f2e;    --op-on-teal-tint:#6fd0cc;
  --op-green-tint:#11301f;   --op-on-green-tint:#72d6a0;
  --op-amber-tint:#33260f;   --op-on-amber-tint:#e4ae55;
  --op-danger-tint:#36181c;  --op-on-danger-tint:#f2929a;
  --op-indigo-tint:#1a2742;  --op-on-indigo-tint:#97b1f2;
  --op-banner-bg:#2b2210; --op-banner-border:#4a3a16; --op-banner-ink:#e8c37a; --op-banner-icon:#e2ad52;
  --op-ai-bg:#1e1b2e; --op-ai-border:#342d52; --op-ai-ink:#cfc8ea; --op-ai-badge:#8a7ad0;
  --op-ws-candidate:#4da3f5; --op-ws-sales:#f08a3c;
  --op-c1:#4da3f5; --op-c2:#c08324; --op-c3:#2fb4ae; --op-c4:#c46a99;
  --op-chart-track:#2a2927; --op-chart-grid:#2a2927; --op-skeleton:#2a2927; --op-overlay:rgba(3,8,14,.62);
  --op-shadow-card:0 1px 2px rgb(0 0 0 / .35), 0 2px 8px rgb(0 0 0 / .25);
  --op-shadow-hover:0 6px 20px rgb(0 0 0 / .45);
  --op-shadow-popover:0 10px 30px rgb(0 0 0 / .55);
  --op-shadow-sticky:0 -4px 14px rgb(0 0 0 / .4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --op-bg:#191919; --op-surface:#202020; --op-panel-head:#252525; --op-raised:#2a2a2a;
    --op-nav:#171717; --op-nav-active:#2f2f2f; --op-nav-border:#2f2f2f; --op-nav-ink:#b4aea8;
    --op-nav-ink-strong:#ece8e3; --op-nav-ink-muted:#8f8983; --op-nav-badge:#e4ae55; --op-on-nav-badge:#2a1d00;
    --op-ink:#f1efed; --op-muted:#a8a29b; --op-faint:#8f8983;
    --op-line:#33312f; --op-hair:#2a2927; --op-field-border:#454340; --op-field-bg:#1b1b1b;
    --op-primary:#4da3f5; --op-on-primary:#04213f; --op-primary-hover:#74b8f8;
    --op-primary-tint:#16293f; --op-primary-tint-border:#24476b; --op-on-primary-tint:#9fcdfa; --op-focus:#74b8f8;
    --op-neutral-tint:#2a2927; --op-on-neutral-tint:#cbc5be;
    --op-teal-tint:#142f2e;    --op-on-teal-tint:#6fd0cc;
    --op-green-tint:#11301f;   --op-on-green-tint:#72d6a0;
    --op-amber-tint:#33260f;   --op-on-amber-tint:#e4ae55;
    --op-danger-tint:#36181c;  --op-on-danger-tint:#f2929a;
    --op-indigo-tint:#1a2742;  --op-on-indigo-tint:#97b1f2;
    --op-banner-bg:#2b2210; --op-banner-border:#4a3a16; --op-banner-ink:#e8c37a; --op-banner-icon:#e2ad52;
    --op-ai-bg:#1e1b2e; --op-ai-border:#342d52; --op-ai-ink:#cfc8ea; --op-ai-badge:#8a7ad0;
    --op-ws-candidate:#4da3f5; --op-ws-sales:#f08a3c;
    --op-c1:#4da3f5; --op-c2:#c08324; --op-c3:#2fb4ae; --op-c4:#c46a99;
    --op-chart-track:#2a2927; --op-chart-grid:#2a2927; --op-skeleton:#2a2927; --op-overlay:rgba(3,8,14,.62);
    --op-shadow-card:0 1px 2px rgb(0 0 0 / .35), 0 2px 8px rgb(0 0 0 / .25);
    --op-shadow-hover:0 6px 20px rgb(0 0 0 / .45);
    --op-shadow-popover:0 10px 30px rgb(0 0 0 / .55);
    --op-shadow-sticky:0 -4px 14px rgb(0 0 0 / .4);
  }
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--op-bg);color:var(--op-ink);font-family:var(--op-font);font-size:var(--op-text-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--op-primary);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--op-focus);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--op-font-mono)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.no-anim *{transition:none!important}
.jlink,.sw,.wsw button,.brand,.rlink{position:relative}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ================================================================ SHELL */
/* Full-width app bar on top (hamburger first, everything on one line), journey bar under it,
   then the body: rail (Advanced only, collapsible to 60px) + page. Under 860px the rail is a drawer. */
.app{min-height:100vh;display:flex;flex-direction:column;--ws:var(--op-ws-candidate);--chrome-h:101px}
.app.ws-sales{--ws:var(--op-ws-sales)}
.body{flex:1 0 auto;display:flex;min-width:0}
.rail{width:var(--op-nav-width);flex-shrink:0;background:var(--op-nav);border-right:1px solid var(--op-nav-border);
  display:flex;flex-direction:column;position:sticky;top:var(--chrome-h);height:calc(100vh - var(--chrome-h));padding:12px 10px;overflow-y:auto;overscroll-behavior:contain}
.rail[hidden]{display:none}
.rail.collapsed{width:60px;padding:12px 8px}
.rail.collapsed .rlabel{height:1px;overflow:hidden;padding:0;margin:8px 6px;background:var(--op-nav-border)}
.rail.collapsed .rlink{justify-content:center;padding:0}
.rail.collapsed .rlink .rt,.rail.collapsed .rfoot .rt{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rail.collapsed .rlink .rc{position:absolute;top:5px;right:6px;min-width:8px;width:8px;height:8px;padding:0;font-size:0}
.rail.collapsed .rlink .rc.m{display:none}
.rail.collapsed .rfoot{align-items:center}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.drawer{position:fixed;inset:0;z-index:75}
.drawer .scr{position:absolute;inset:0;background:var(--op-overlay);animation:fade .15s var(--op-ease-out)}
.drawer .rail{position:absolute;left:0;top:0;height:100%;width:272px;max-width:86vw;box-shadow:var(--op-shadow-popover);animation:slidein .2s var(--op-ease-out);padding-top:10px}
@keyframes slidein{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}
.dhead{display:flex;align-items:center;gap:10px;padding:2px 4px 12px;border-bottom:1px solid var(--op-nav-border);margin-bottom:10px}
.notice{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:18px;border-radius:10px;background:var(--op-banner-bg);border:1px solid var(--op-banner-border);color:var(--op-banner-ink);font-size:12.5px}
.notice svg{color:var(--op-banner-icon);flex-shrink:0}
.notice .sp{flex:1}
.notice button{border:0;background:transparent;color:var(--op-banner-ink);cursor:pointer;width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.notice button:hover{background:rgb(0 0 0 / .06)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--op-line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;cursor:pointer;padding:9px 12px;font-size:13.5px;font-weight:500;color:var(--op-muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--op-ink)}
.tabs button[aria-selected="true"]{color:var(--op-ink);font-weight:600;border-bottom-color:var(--op-primary)}
.tabs .tc{font-size:11px;font-weight:650;padding:0 6px;border-radius:6px;background:var(--op-amber-tint);color:var(--op-on-amber-tint)}
.typecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tcard{text-align:left;padding:12px 14px;border-radius:var(--op-radius);border:1.5px solid var(--op-line);background:var(--op-surface);cursor:pointer}
.tcard b{display:flex;align-items:center;gap:8px;font-size:13.5px}
.tcard b i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--op-field-border);display:block;flex-shrink:0}
.tcard p{font-size:12.5px;color:var(--op-muted);margin-top:4px}
.tcard[aria-checked="true"]{border-color:var(--op-primary);background:var(--op-primary-tint)}
.tcard[aria-checked="true"] b i{border-color:var(--op-primary);background:radial-gradient(circle,var(--op-primary) 0 4px,transparent 5px)}
.savebar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:10px;margin:20px -20px -20px;padding:12px 20px;
  background:var(--op-surface);border-top:1px solid var(--op-line);border-radius:0 0 var(--op-radius-card) var(--op-radius-card);box-shadow:var(--op-shadow-sticky)}
.cmd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* --- top bar: one 52px line, never wraps (priority-hides instead) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--op-surface);border-bottom:1px solid var(--op-line)}
.topbar{display:flex;align-items:center;height:var(--op-header-height);padding:0 16px;gap:12px;flex-wrap:nowrap}
.tb-l{display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto;overflow:hidden}
.tb-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb-gap{flex:1 1 12px;min-width:12px}
.tb-sep{width:1px;height:18px;background:var(--op-line);flex-shrink:0;margin:0 4px}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0;color:var(--op-ink);font-weight:650;font-size:14.5px;letter-spacing:-.02em;cursor:pointer;background:none;border:0;padding:0}
.brand .mk{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--op-ink);color:var(--op-surface)}
.ibtn{width:32px;height:32px;border-radius:var(--op-radius-control);border:1px solid transparent;background:transparent;
  color:var(--op-muted);display:grid;place-items:center;cursor:pointer;flex-shrink:0;position:relative;
  transition:background-color .15s var(--op-ease-out), color .15s var(--op-ease-out), transform .16s var(--op-ease-out)}
.ibtn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){ .ibtn:hover{background:var(--op-neutral-tint);color:var(--op-ink)} }
.wsw{display:flex;padding:2px;gap:2px;background:var(--op-panel-head);border:1px solid var(--op-line);border-radius:9px;flex-shrink:0}
.wsw button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;color:var(--op-muted);
  font-size:13px;font-weight:500;padding:4px 11px 4px 9px;border-radius:7px;white-space:nowrap;
  transition:background-color .15s var(--op-ease-out), color .15s var(--op-ease-out)}
.wsw button i{width:7px;height:7px;border-radius:50%;background:var(--op-faint);display:block}
.wsw button[aria-pressed="true"]{background:var(--op-surface);color:var(--op-ink);font-weight:600;box-shadow:var(--op-shadow-card)}
.wsw button[data-ws="candidate"][aria-pressed="true"] i{background:var(--op-ws-candidate)}
.wsw button[data-ws="sales"][aria-pressed="true"] i{background:var(--op-ws-sales)}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden}
.crumb .sec{color:var(--op-muted)} .crumb .sl{color:var(--op-field-border)}
.crumb b{font-weight:600;color:var(--op-ink);overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;min-width:210px;border-radius:var(--op-radius-control);
  border:1px solid var(--op-line);background:var(--op-panel-head);color:var(--op-faint);font-size:13px;cursor:pointer;flex-shrink:0}
.search:hover{border-color:var(--op-field-border);color:var(--op-muted)}
.search kbd,.kbd{margin-left:auto;font-family:var(--op-font-mono);font-size:10.5px;padding:1px 5px;border-radius:4px;border:1px solid var(--op-line);background:var(--op-surface);color:var(--op-muted)}
.sw{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 8px;border:0;background:none;border-radius:var(--op-radius-control);
  color:var(--op-muted);font-size:var(--op-text-meta);font-weight:500;cursor:pointer;white-space:nowrap}
@media (hover:hover) and (pointer:fine){ .sw:hover{background:var(--op-neutral-tint);color:var(--op-ink)} }
.sw .tk{position:relative;width:28px;height:16px;border-radius:999px;background:var(--op-field-border);flex-shrink:0;transition:background-color .15s var(--op-ease-out)}
.sw .tk i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .2);transition:transform .15s var(--op-ease-out)}
.sw[aria-checked="true"]{color:var(--op-ink)}
.sw[aria-checked="true"] .tk{background:var(--op-primary)}
.sw[aria-checked="true"] .tk i{transform:translateX(12px)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;
  background:var(--op-primary-tint);color:var(--op-on-primary-tint);border:1px solid var(--op-primary-tint-border);cursor:pointer;flex-shrink:0}
.dotnew{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--op-on-danger-tint);border:2px solid var(--op-surface)}

/* --- journey bar: the spine. One quiet row under the top bar */
.journey{display:flex;justify-content:center;padding:8px 16px;border-top:1px solid var(--op-hair);overflow-x:auto}
.jl{display:flex;align-items:center;gap:2px;list-style:none;margin:0;padding:0}
.jl li{display:flex;align-items:center}
.jl li+li::before{content:"";width:20px;height:1px;background:var(--op-line);margin:0 2px}
.jlink{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 11px 0 6px;border-radius:999px;border:1px solid transparent;
  background:none;cursor:pointer;color:var(--op-muted);font-size:13px;font-weight:500;white-space:nowrap;
  transition:background-color .15s var(--op-ease-out), color .15s var(--op-ease-out)}
@media (hover:hover) and (pointer:fine){ .jlink:hover{background:var(--op-neutral-tint);color:var(--op-ink)} }
.jn{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--op-neutral-tint);color:var(--op-muted);flex-shrink:0}
.jlink.done .jn{background:var(--op-green-tint);color:var(--op-on-green-tint)}
.jlink.done{color:var(--op-ink)}
.jlink.here{background:var(--op-primary-tint);border-color:var(--op-primary-tint-border);color:var(--op-on-primary-tint);font-weight:600}
.jlink.here .jn{background:var(--op-primary);color:var(--op-on-primary)}
.jcount{min-width:20px;height:18px;padding:0 6px;border-radius:999px;background:var(--op-nav-badge);color:var(--op-on-nav-badge);font-size:11px;font-weight:650;display:grid;place-items:center}
.jnext{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--op-primary);color:var(--op-on-primary)}

/* --- next bar (Guide on) */
.nextbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--op-primary-tint);border-bottom:1px solid var(--op-primary-tint-border);color:var(--op-on-primary-tint);font-size:13.5px}
.nextbar b{font-weight:600}
.nextbar .sp{flex:1}

/* --- rail (Advanced) */
.rhead{display:none}
.rgrp{display:flex;flex-direction:column;gap:1px;margin-bottom:14px}
.rlabel{font-size:var(--op-text-micro);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--op-nav-ink-muted);padding:8px 10px 4px}
.rlink{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--op-radius-control);border:0;background:none;width:100%;
  color:var(--op-nav-ink);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;transition:background-color .12s var(--op-ease-out)}
@media (hover:hover) and (pointer:fine){ .rlink:hover{background:var(--op-nav-active);color:var(--op-nav-ink-strong)} }
.rlink[aria-current="page"]{background:var(--op-nav-active);color:var(--op-nav-ink-strong);font-weight:600}
.rlink svg{flex-shrink:0;opacity:.85}
.rlink .rc{margin-left:auto;font-size:11px;font-weight:650;min-width:20px;height:18px;padding:0 6px;border-radius:999px;display:grid;place-items:center;
  background:var(--op-nav-badge);color:var(--op-on-nav-badge)}
.rlink .rc.m{background:transparent;color:var(--op-nav-ink-muted);font-weight:500}
.rfoot{margin-top:auto;padding:10px 8px 2px;border-top:1px solid var(--op-nav-border);display:flex;flex-direction:column;gap:6px}
.rstat{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--op-nav-ink-muted)}
.rstat i{width:6px;height:6px;border-radius:50%;display:block;flex-shrink:0}

/* --- page */
.page{width:100%;max-width:1040px;margin:0 auto;padding:28px 24px 96px}
.adv .page{max-width:1320px}
.ph{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h2{font-size:var(--op-text-page);font-weight:650;letter-spacing:-.025em;line-height:1.2}
.ph p{color:var(--op-muted);margin-top:5px;max-width:64ch}
.ph .sp{flex:1 1 20px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.foot{border-top:1px solid var(--op-line);background:var(--op-surface);padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--op-muted)}
.foot .fs{display:inline-flex;align-items:center;gap:6px}
.foot .fs i{width:6px;height:6px;border-radius:50%;display:block}
.foot .sp{flex:1}
.foot a{color:var(--op-muted);cursor:pointer} .foot a:hover{color:var(--op-ink)}

/* ================================================================ PRIMITIVES */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--op-radius-control);
  border:1px solid var(--op-field-border);background:var(--op-surface);color:var(--op-ink);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background-color .15s var(--op-ease-out), border-color .15s var(--op-ease-out), transform .16s var(--op-ease-out)}
.btn:active:not(:disabled){transform:scale(.97)}
@media (hover:hover) and (pointer:fine){ .btn:hover{background:var(--op-panel-head)} }
.btn.pri{background:var(--op-primary);border-color:var(--op-primary);color:var(--op-on-primary);font-weight:600}
@media (hover:hover) and (pointer:fine){ .btn.pri:hover{background:var(--op-primary-hover);border-color:var(--op-primary-hover)} }
.btn.gh{border-color:transparent;background:transparent;color:var(--op-muted)}
@media (hover:hover) and (pointer:fine){ .btn.gh:hover{background:var(--op-neutral-tint);color:var(--op-ink)} }
.btn.sm{height:30px;padding:0 11px;font-size:12.5px}
.btn.danger{color:var(--op-on-danger-tint);border-color:var(--op-on-danger-tint)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--op-surface);border:1px solid var(--op-line);border-radius:var(--op-radius-card);box-shadow:var(--op-shadow-card)}
.card.pad{padding:20px}
.card.sig{background:var(--op-primary-tint);border-color:var(--op-primary-tint-border)}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--op-radius-chip);font-size:11.5px;font-weight:600;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.b-neutral{background:var(--op-neutral-tint);color:var(--op-on-neutral-tint)}
.b-green{background:var(--op-green-tint);color:var(--op-on-green-tint)}
.b-amber{background:var(--op-amber-tint);color:var(--op-on-amber-tint)}
.b-danger{background:var(--op-danger-tint);color:var(--op-on-danger-tint)}
.b-blue{background:var(--op-primary-tint);color:var(--op-on-primary-tint)}
.b-teal{background:var(--op-teal-tint);color:var(--op-on-teal-tint)}
.b-indigo{background:var(--op-indigo-tint);color:var(--op-on-indigo-tint)}
.b-ai{background:var(--op-ai-bg);color:var(--op-ai-badge);border:1px solid var(--op-ai-border)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:var(--op-radius-chip);background:var(--op-panel-head);color:var(--op-muted);font-size:11.5px;font-weight:500;border:1px solid var(--op-hair)}
.eyebrow{font-size:var(--op-text-micro);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--op-muted)}
.sh{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.sh h3{font-size:var(--op-text-screen);font-weight:600;letter-spacing:-.01em}
.sh .sp{flex:1} .sh small{font-size:12.5px;color:var(--op-muted)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500}
.field .hint{font-size:12px;color:var(--op-muted)}
.inp{width:100%;height:38px;padding:0 12px;border-radius:var(--op-radius-control);border:1px solid var(--op-field-border);background:var(--op-field-bg);font-size:14px;outline:0;
  transition:border-color .15s var(--op-ease-out), box-shadow .15s var(--op-ease-out)}
.inp:focus{border-color:var(--op-focus);box-shadow:0 0 0 3px var(--op-primary-tint)}
.inp::placeholder{color:var(--op-faint)}
textarea.inp{height:auto;padding:10px 12px;line-height:1.55;resize:vertical}
.inpw{position:relative;display:flex;align-items:center}
.inpw>svg{position:absolute;left:11px;color:var(--op-faint);pointer-events:none}
.inpw .inp{padding-left:34px}

.cb{appearance:none;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--op-field-border);background:var(--op-field-bg);cursor:pointer;flex-shrink:0;position:relative;margin:0;
  transition:background-color .12s var(--op-ease-out), border-color .12s var(--op-ease-out)}
.cb:checked{background:var(--op-primary);border-color:var(--op-primary)}
.cb:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid var(--op-on-primary);border-width:0 2px 2px 0;transform:rotate(42deg)}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px}
.chk span{flex:1}
.chk em{font-style:normal;font-size:11.5px;color:var(--op-muted)}
.seg{display:flex;gap:2px;padding:2px;background:var(--op-panel-head);border:1px solid var(--op-line);border-radius:9px}
.seg button{flex:1;min-width:0;border:0;background:transparent;cursor:pointer;border-radius:7px;padding:5px 4px;font-size:12.5px;font-weight:500;color:var(--op-muted)}
.seg button[aria-pressed="true"]{background:var(--op-surface);color:var(--op-ink);font-weight:600;box-shadow:var(--op-shadow-card)}

/* ================================================================ CARDS (DESIGN.md §13) */
.clist{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.step{display:flex;align-items:center;gap:14px;padding:16px 18px}
.step .sn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:13px;font-weight:650;background:var(--op-neutral-tint);color:var(--op-muted)}
.step.done{background:var(--op-panel-head);box-shadow:none} .step.done .sn{background:var(--op-green-tint);color:var(--op-on-green-tint)} .step.done b{color:var(--op-muted)}
.step.sig .sn{background:var(--op-primary);color:var(--op-on-primary)}
.step .sb{flex:1;min-width:0} .step b{font-size:14.5px;font-weight:600;display:block} .step p{font-size:13px;color:var(--op-muted);margin-top:2px}
.step.sig p{color:var(--op-on-primary-tint)}

.lead{display:flex;align-items:center;gap:14px;padding:14px 16px;position:relative;
  transition:box-shadow .2s var(--op-ease-out), transform .2s var(--op-ease-out), border-color .2s var(--op-ease-out)}
@media (hover:hover) and (pointer:fine){ .lead:hover{box-shadow:var(--op-shadow-hover);transform:translateY(-1px)} }
.lead.kfocus{border-color:var(--op-focus);box-shadow:0 0 0 3px var(--op-primary-tint)}
.lead.sel{background:var(--op-primary-tint);border-color:var(--op-primary-tint-border)}
.lead .ini{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:13px;font-weight:650;background:var(--op-panel-head);color:var(--op-muted);border:1px solid var(--op-hair)}
.lead .lb{flex:1;min-width:0}
.lead .lt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lead .lt a{font-size:14.5px;font-weight:600;color:var(--op-ink);letter-spacing:-.01em;cursor:pointer}
.lead .lt a:hover{color:var(--op-primary)}
.lead .lm{font-size:12.5px;color:var(--op-muted);margin-top:2px}
.lead .lw{font-size:13px;color:var(--op-ink);margin-top:6px}
.lead .lc{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.lead .la{display:flex;gap:6px;flex-shrink:0}
.ring{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:52px}
.ring .rr{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--op-chart-track) 0)}
.ring .rr::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--op-surface)}
.lead.sel .ring .rr::after{background:var(--op-primary-tint)}
.ring .rr b{position:relative;z-index:1;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.ring small{font-size:10.5px;color:var(--op-muted);margin-top:2px}

.stat{padding:16px 18px}
.stat .k{font-size:12.5px;color:var(--op-muted);display:flex;align-items:center;gap:6px}
.stat .v{font-size:var(--op-text-metric);font-weight:650;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .d{font-size:12px;color:var(--op-muted);margin-top:2px}
.stat .d.up{color:var(--op-on-green-tint)}
.stat svg.sp{display:block;width:100%;height:28px;margin-top:10px;overflow:visible}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* bulk bar (§13) */
.bulk{position:sticky;bottom:16px;z-index:20;margin-top:16px;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;
  background:var(--op-ink);color:var(--op-surface);border-radius:12px;box-shadow:var(--op-shadow-popover);animation:rise .2s var(--op-ease-out)}
.bulk b{font-size:13.5px}
.bulk .sp{flex:1}
.bulk .btn{height:32px;background:transparent;border-color:rgb(255 255 255 / .22);color:var(--op-surface)}
:root[data-theme="dark"] .bulk .btn{border-color:rgb(0 0 0 / .2)}
.bulk .btn.pri{background:var(--op-surface);color:var(--op-ink);border-color:var(--op-surface)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* toast with undo (§15 prefers undo over confirm) */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:14px;
  padding:10px 10px 10px 16px;border-radius:10px;background:var(--op-ink);color:var(--op-surface);box-shadow:var(--op-shadow-popover);font-size:13.5px;animation:rise .2s var(--op-ease-out)}
.toast button{border:0;background:transparent;color:var(--op-surface);font-weight:600;cursor:pointer;padding:5px 10px;border-radius:6px}
.toast button:hover{background:rgb(255 255 255 / .12)}

/* evidence + AI marking (§1.3: generated text never styled like evidence) */
.ev{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--op-hair)}
.ev:last-child{border-bottom:0}
.ev .mk{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.ev .mk.y{background:var(--op-green-tint);color:var(--op-on-green-tint)}
.ev .mk.n{background:var(--op-danger-tint);color:var(--op-on-danger-tint)}
.ev .mk.u{background:var(--op-amber-tint);color:var(--op-on-amber-tint)}
.ev b{font-size:13.5px;font-weight:600}
.ev blockquote{margin:5px 0 0;padding:0 0 0 10px;border-left:2px solid var(--op-field-border);font-size:13px;color:var(--op-muted)}
.ev .pts{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--op-muted);flex-shrink:0;font-variant-numeric:tabular-nums}
.ai{background:var(--op-ai-bg);border:1px solid var(--op-ai-border);border-radius:var(--op-radius);padding:14px 16px;color:var(--op-ai-ink)}
.ai .aih{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ready{display:flex;flex-wrap:wrap;gap:6px}
.ready span{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:999px;font-size:12px;border:1px solid var(--op-line);background:var(--op-surface)}
.ready span.ok{border-color:transparent;background:var(--op-green-tint);color:var(--op-on-green-tint)}

/* split review (Advanced) */
.dgrid{}
@media (max-width:860px){ .dgrid{grid-template-columns:minmax(0,1fr)!important} }
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:20px;align-items:start}
.split .pane{position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto}

/* kanban (Advanced pipeline) */
.kan{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--op-panel-head);border:1px solid var(--op-hair);border-radius:var(--op-radius);padding:10px;min-height:320px}
.kcol h4{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:2px 4px 10px}
.kcol h4 em{font-style:normal;margin-left:auto;font-weight:500;color:var(--op-muted)}
.kcard{background:var(--op-surface);border:1px solid var(--op-line);border-radius:10px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--op-shadow-card);cursor:grab}
.kcard b{font-size:13px;font-weight:600;display:block}
.kcard p{font-size:12px;color:var(--op-muted);margin-top:2px}
.kcard .kf{display:flex;align-items:center;gap:6px;margin-top:9px}

/* filters */
.find{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.fpanel{position:sticky;top:120px}
.fg{border-bottom:1px solid var(--op-hair)} .fg:last-child{border-bottom:0}
.fg>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 16px;cursor:pointer;font-size:13px;font-weight:600}
.fg>summary::-webkit-details-marker{display:none}
.fg>summary .v{margin-left:auto;font-weight:500;font-size:12px;color:var(--op-primary)}
.fg>summary svg{color:var(--op-faint);transition:transform .15s var(--op-ease-out)}
.fg[open]>summary svg{transform:rotate(90deg)}
.fb{padding:0 16px 14px;display:flex;flex-direction:column;gap:9px}
.qf{display:flex;gap:6px;flex-wrap:wrap}
.qf button{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--op-line);background:var(--op-surface);font-size:12.5px;font-weight:500;color:var(--op-muted);cursor:pointer}
.qf button[aria-pressed="true"]{background:var(--op-primary-tint);border-color:var(--op-primary-tint-border);color:var(--op-on-primary-tint)}
.rhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rhd .n{font-size:20px;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.rhd .n small{font-size:13px;font-weight:400;color:var(--op-muted);letter-spacing:0}
.fchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;background:var(--op-primary-tint);color:var(--op-on-primary-tint);font-size:12px;border:1px solid var(--op-primary-tint-border);cursor:pointer}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--op-muted)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--op-on-green-tint);display:block}
.slider{width:100%;accent-color:var(--op-primary)}

/* meters & charts (§9) */
.meter .mt{display:flex;align-items:baseline;gap:8px;font-size:12.5px;margin-bottom:5px}
.meter .mt b{flex:1;font-weight:500}
.meter .mt em{font-style:normal;color:var(--op-muted);font-variant-numeric:tabular-nums}
.meter .mb{height:6px;border-radius:3px;background:var(--op-chart-track);overflow:hidden}
.meter .mb u{display:block;height:100%;border-radius:3px}
.status-q{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--op-muted);white-space:nowrap}
.status-q i{width:6px;height:6px;border-radius:50%;background:var(--op-on-amber-tint);display:block}
.chart{padding:18px 18px 14px}
.chart header{display:flex;align-items:flex-start;gap:10px}
.chart header h4{font-size:14px;font-weight:600}
.chart header .sp{flex:1}
.chart .take{font-size:13px;color:var(--op-muted);margin-top:3px}
.chart .fig{position:relative;margin-top:14px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.axl{font-size:10px;fill:var(--op-faint);font-variant-numeric:tabular-nums}
.gl{stroke:var(--op-chart-grid);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--op-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:3px;border-radius:2px;display:block}
.tt{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-115%);z-index:5;background:var(--op-surface);border:1px solid var(--op-line);
  border-radius:8px;padding:7px 10px;box-shadow:var(--op-shadow-popover);font-size:12px;white-space:nowrap;transition:opacity .12s var(--op-ease-out)}
.tt b{display:block;font-size:11px;color:var(--op-muted);font-weight:500;margin-bottom:3px}
.tt div{display:flex;align-items:center;gap:6px}
.tt div i{width:8px;height:8px;border-radius:2px;display:block}
.tt div em{font-style:normal;margin-left:auto;padding-left:12px;font-weight:600;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:var(--op-text-micro);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--op-muted);padding:10px 14px;background:var(--op-panel-head);border-bottom:1px solid var(--op-line);white-space:nowrap}
td{padding:0 14px;height:var(--op-row-height,40px);border-bottom:1px solid var(--op-hair)}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;border-radius:var(--op-radius-card)}

/* overlays */
.scrim{position:fixed;inset:0;z-index:80;background:var(--op-overlay);display:grid;place-items:start center;padding:12vh 20px 20px;overflow-y:auto;overscroll-behavior:contain;animation:fade .15s var(--op-ease-out)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{width:100%;max-width:480px;background:var(--op-surface);border:1px solid var(--op-line);border-radius:var(--op-radius-card);box-shadow:var(--op-shadow-popover);overflow:hidden;animation:pop .2s var(--op-ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(4px)}to{opacity:1;transform:none}}
.dlg header{display:flex;gap:12px;padding:18px 20px 0;align-items:flex-start}
.dlg header h3{font-size:16px;font-weight:600;letter-spacing:-.015em}
.dlg header p{font-size:13px;color:var(--op-muted);margin-top:3px}
.dlg .db{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dlg footer{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--op-line);background:var(--op-panel-head)}
.dlg footer .sp{flex:1}
.pal{max-width:580px}
.pal .pin{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-bottom:1px solid var(--op-line)}
.pal .pin input{flex:1;border:0;background:transparent;outline:0;font-size:15px}
.pal .pl{max-height:380px;overflow:auto;padding:6px}
.pal .pg{font-size:var(--op-text-micro);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--op-faint);padding:10px 10px 4px}
.pal .pi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:8px;font-size:13.5px;cursor:pointer;text-align:left;color:var(--op-ink)}
.pal .pi svg{color:var(--op-muted)}
.pal .pi[aria-selected="true"]{background:var(--op-primary-tint);color:var(--op-on-primary-tint)}
.pal .pi .kbd{margin-left:auto}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:60;background:var(--op-surface);border:1px solid var(--op-line);border-radius:var(--op-radius);box-shadow:var(--op-shadow-popover);overflow:hidden;animation:pop .15s var(--op-ease-out)}

function visible(){
  if (S.empty) return [];
  var f=S.f;
  return J.filter(function(j){
    if (j.st!=="waiting") return false;
    if (f.hideAg && j.ag) return false;
    if (f.src!=="all" && j.src!==f.src) return false;
    if (j.d>f.posted) return false;
    if (j.s<f.min) return false;
    if (!f[j.mo]) return false;
    if (S.remoteOnly && j.mo!=="remote") return false;
    if (S.visa && !j.visa) return false;
    if (f.kw.length){ var h=(j.t+" "+j.tech.join(" ")+" "+j.why).toLowerCase(); for(var i=0;i<f.kw.length;i++) if(h.indexOf(f.kw[i].toLowerCase())<0) return false; }
    return true;
  }).sort(function(a,b){return b.s-a.s;});
}

/* ===================================================================== ENHANCEMENTS (v4): KPI band, rich cards, goal, funnel, health, timeline */
var TINTS=["t-blue","t-teal","t-indigo","t-amber","t-green"];
function hashTint(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return TINTS[h%TINTS.length]; }
function logo(co){ return '<span class="logo '+hashTint(co)+'" aria-hidden="true">'+esc(co.split(/\s+/).map(function(w){return w[0];}).slice(0,2).join(""))+'</span>'; }
function deltaBadge(d){ if(d==null||d==="") return ""; var s=String(d), up=s.charAt(0)==="+", dn=s.charAt(0)==="-"||s.charAt(0)==="−";
  return '<span class="delta '+(up?"up":dn?"down":"flat")+'">'+(up?ic("up",11,2.6)+'<span class="vh">up </span>':dn?ic("down",11,2.6)+'<span class="vh">down </span>':"")+s.replace(/^[+−-]/,"")+'</span>'; }
function kpi(icon,tone,label,value,delta,sub,sv,sc){
  return '<div class="card kpi"><div class="kh"><span class="ichip '+tone+'">'+ic(icon,15)+'</span>'+label+'</div>'+
    '<div class="kv"><b>'+value+'</b>'+deltaBadge(delta)+'</div>'+(sub?'<div class="ks">'+sub+'</div>':'')+(sv?spark(sv,sc||"var(--op-c1)"):'')+'</div>'; }
/* every existing stat tile is upgraded to the KPI style: icon chip by meaning, colour by series, ↑ text becomes a delta badge */
function stat(k,v,d,up,sv,c){
  var key=String(k).toLowerCase(), icon="activity";
  [["found","search"],["waiting","inbox"],["approv","check"],["appl","send"],["contact","send"],["respond","mail"],["repl","mail"],["rate","target"],["median","clock"],["deal","card"],["outreach","send"],["value","wallet"],["submit","users"],["review","inbox"]]
    .some(function(p){ if(key.indexOf(p[0])>=0){ icon=p[1]; return true; } return false; });
  var tone={"var(--op-c1)":"t-blue","var(--op-c2)":"t-amber","var(--op-c3)":"t-teal","var(--op-c4)":"t-indigo"}[c]||"t-neutral";
  var dd=String(d==null?"":d), m=dd.match(/^↑\s*([\d.]+%?)\s*(.*)$/);
  return kpi(icon,tone,k,v,m?"+"+m[1]:null,m?m[2]:dd,sv,c);
}

var _companies=companies;
companies=function(){ return _companies().filter(function(c){ return !CODONE[c.co]; }); };
function act(id,kind){
  id=String(id); var list=items(), it=null; list.forEach(function(x){ if(String(x.id)===id) it=x; });
  if(id.indexOf("c:")===0) CODONE[id.slice(2)]=kind; else J.forEach(function(j){ if(String(j.id)===id) j.st=kind; });
  delete S.sel[id]; render();
  toast((kind==="approved"?"Approved":"Skipped")+" — "+esc(it?it.title:"")+(kind==="approved"?". Nothing was sent.":""), {id:id});
}
function undo(u){ if(!u) return; var id=String(u.id); if(id.indexOf("c:")===0) delete CODONE[id.slice(2)]; else J.forEach(function(j){ if(String(j.id)===id) j.st="waiting"; });
  document.getElementById("toast").innerHTML=""; render(); }

/* ===================================================================== EVENTS */
document.addEventListener("click",function(e){
  var t=e.target, c;
  if((c=t.closest("[data-scrim]")) && t===c){ S.overlay=null; paintOverlay(); return; }
  if(t.closest("[data-close]")){ S.overlay=null; paintOverlay(); return; }
  if(t.closest("[data-closedrawer]")){ S.drawer=false; renderRail(); renderTop(); document.getElementById("burger").focus(); return; }
  if(t.closest("#burger")){
    if(S.adv && window.innerWidth>860){ S.railCollapsed=!S.railCollapsed; renderRail(); renderTop(); }
    else { S.drawer=true; renderRail(); renderTop(); }
    return; }
  if((c=t.closest("[data-ov]"))){ S.overlay=c.getAttribute("data-ov"); S.pop=null; renderTop(); paintOverlay(); return; }
  if((c=t.closest("[data-pop]"))){ var p=c.getAttribute("data-pop"); S.pop=S.pop===p?null:p; renderTop(); return; }
  if(S.pop && !t.closest(".pop")){ S.pop=null; renderTop(); }
  if((c=t.closest("[data-go]"))){ go(c.getAttribute("data-go")); return; }
  if((c=t.closest("[data-ws]"))){ S.ws=c.getAttribute("data-ws"); S.sel={}; if(S.screen==="deals"||S.screen==="candidates") S.screen="home"; render(); return; }
  if((c=t.closest("[data-tog]"))){ var k=c.getAttribute("data-tog"); S[k]=!S[k]; if(k==="adv"&&!S.adv&&["campaigns","builder","followups","insights","connectors","howitworks","deals","candidates"].indexOf(S.screen)>=0) S.screen="home"; render(); return; }
  if(t.closest("#themebtn")){ setTheme(nextThemeOf(S.theme)); render(); return; }
  if((c=t.closest("[data-theme-set]"))){ setTheme(c.getAttribute("data-theme-set")); render(); return; }
  if(t.closest("[data-hidenotice]")){ S.notice=false; render(); return; }
  if(t.closest("[data-trends]")){ toast("Market trends opens as its own view, not as a job site.",null); return; }
  if((c=t.closest("[data-data]"))){ S.empty=c.getAttribute("data-data")==="empty"; [].forEach.call(document.querySelectorAll("[data-data]"),function(b){b.setAttribute("aria-pressed",String(b===c));}); render(); return; }
  if((c=t.closest("[data-open]"))){ var id=c.getAttribute("data-open"); if(String(id).indexOf("c:")===0) S.co=id.slice(2); else S.job=+id; go("detail"); return; }
  if((c=t.closest("[data-act]"))){ act(c.getAttribute("data-id"), c.getAttribute("data-act")==="approve"?"approved":"skipped"); return; }
  if((c=t.closest("[data-bulk]"))){ var b=c.getAttribute("data-bulk");
    if(b==="clear") S.sel={}; else if(b==="all") items().forEach(function(it){S.sel[it.id]=true;});
    else if(b==="draft"){ var nd=Object.keys(S.sel).filter(function(k){return S.sel[k];}).length; S.sel={}; go("outreach"); toast(plural(nd,"draft")+" written. Nothing was sent.",null); return; }
    else { var ids=Object.keys(S.sel).filter(function(k){return S.sel[k];}); ids.forEach(function(id){ if(id.indexOf("c:")===0) CODONE[id.slice(2)]="approved"; else J.forEach(function(j){ if(String(j.id)===id) j.st="approved"; }); });
      S.sel={}; render(); toast("Approved "+plural(ids.length,V("job","lead"))+". Nothing was sent.",null); return; }
    render(); return; }
  if(t.closest("[data-undo]")){ undo(S.toast&&S.toast.undo); return; }
  if((c=t.closest("[data-src]"))){ S.f.src=c.getAttribute("data-src"); [].forEach.call(document.querySelectorAll("[data-src]"),function(x){x.setAttribute("aria-selected",String(x===c));}); updateFind(); return; }
  if((c=t.closest("[data-otab]"))){ S.oppTab=c.getAttribute("data-otab"); render(); return; }
  if((c=t.closest("[data-range]"))){ S.range=+c.getAttribute("data-range"); render(); return; }
  if((c=t.closest("[data-ptype]"))){ S.ptype=c.getAttribute("data-ptype"); render(); return; }
  if((c=t.closest("[data-posted]"))){ S.f.posted=+c.getAttribute("data-posted"); [].forEach.call(document.querySelectorAll("[data-posted]"),function(x){x.setAttribute("aria-pressed",String(x===c));}); updateFind(); return; }
  if((c=t.closest("[data-rmkw]"))){ S.f.kw.splice(+c.getAttribute("data-rmkw"),1); updateFind(); return; }
  if(t.closest("[data-clear]")){ S.f={kw:[],remote:1,hybrid:1,onsite:1,posted:30,min:0,hideAg:0,src:"all"}; S.remoteOnly=false; S.visa=false; render(); return; }
  if((c=t.closest("[data-obws]"))){ S.obws=c.getAttribute("data-obws"); render(); return; }
  if(t.closest("[data-finish]")){ S.ws=S.obws; go("home"); return; }
  if((c=t.closest("[data-tbl]"))){ var card=c.closest(".chart"), tf=card.querySelector(".tblf"), fig=card.querySelector(".fig");
    tf.hidden=!tf.hidden; c.textContent=tf.hidden?"Show as table":"Show as chart"; if(fig) fig.style.display=tf.hidden?"":"none"; var lg=card.querySelector(".legend"); if(lg) lg.style.display=tf.hidden?"":"none"; return; }
});
document.addEventListener("change",function(e){ var t=e.target;
  if(t.hasAttribute("data-sel")){ S.sel[t.getAttribute("data-sel")]=t.checked; render(); return; }
  if(t.hasAttribute("data-sf")){ S[t.getAttribute("data-sf")]=t.checked; updateFind(); return; }
  if(t.hasAttribute("data-mo")){ S.f[t.getAttribute("data-mo")]=t.checked?1:0; updateFind(); return; }
  if(t.hasAttribute("data-hide")){ S.f.hideAg=t.checked?1:0; updateFind(); return; }
  if(t.id==="jump"){ go(t.value); return; }
});
document.addEventListener("input",function(e){ var t=e.target;
  if(t.id==="minr"){ S.f.min=+t.value; updateFind(); return; }
  if(t.id==="dl"){ var ok=document.querySelector(".dlg .btn.danger"); if(ok) ok.disabled=t.value!=="DELETE"; }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ if(S.overlay){ S.overlay=null; paintOverlay(); return; } if(S.drawer){ S.drawer=false; renderRail(); renderTop(); return; } if(S.pop){ S.pop=null; renderTop(); return; } }
  if(e.target.id==="kwin" && e.key==="Enter" && e.target.value.trim()){ S.f.kw.push(e.target.value.trim()); e.target.value=""; updateFind(); }
});
window.addEventListener("resize",function(){ var top=document.getElementById("top"); if(top && !top.hidden) document.getElementById("app").style.setProperty("--chrome-h", top.offsetHeight+"px"); });

/* ===================================================================== BOOT */
try{ var th=localStorage.getItem("op-theme"); if(th==="dark"||th==="light"){ document.documentElement.setAttribute("data-theme",th); S.theme=th; } }catch(e){}
document.getElementById("jump").innerHTML=JUMP.map(function(g){ return '<optgroup label="'+g[0]+'">'+g[1].map(function(x){return '<option value="'+x[0]+'">'+x[1]+'</option>';}).join("")+'</optgroup>'; }).join("");
render();
})();
</script>

</body>
</html>
