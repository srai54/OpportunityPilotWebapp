# One command to run the whole app locally in demo mode (no database, no keys, guest sign-in):
#   docker compose up        → web http://localhost:5173, API http://localhost:5051
# Expects the API repo next to this one (../OpportunityPilotWebApi), as in the README.
services:
  api:
    build: ../OpportunityPilotWebApi
    environment:
      ConnectionStrings__Main: ""
      Cors__AllowedOrigins__0: http://localhost:5173
      ASPNETCORE_URLS: http://+:8080
    ports: ["5051:8080"]
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: [".:/app", "/app/node_modules"]
    environment:
      VITE_API_BASE_URL: http://localhost:5051
      VITE_DEV_AUTH: ""
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    ports: ["5173:5173"]
    depends_on: [api]
