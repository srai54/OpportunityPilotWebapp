name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      # Production dependencies only; fails on high or critical advisories.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --redact --config .gitleaks.toml

  # Claude Code setup (2026-10-26): MCP servers only from the policy table, deny rules and hooks in place, and the guard hooks tested.
  ai-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .claude/check-ai-config.mjs
      - run: node --test .claude/hooks/hooks.test.mjs

  # Every PR keeps the template's sections, so what changed, what was checked and how to roll back are always written down.
  pr-template:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR description follows the template
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=""
          for section in "## What and why" "## Checked" "## Risk and rollback"; do
            printf '%s' "$BODY" | grep -qF "$section" || missing="$missing [$section]"
          done
          if [ -n "$missing" ]; then echo "The PR description is missing:$missing (see .github/pull_request_template.md)"; exit 1; fi
          echo "PR description has every template section."

  # Browser smoke test of the built app with the API mocked from recorded fixtures (scripts/ci-smoke.mjs): the candidate page,
  # resume builder and tailoring at 1280 light and 375 dark, axe WCAG 2.1 AA, no sideways scroll, no console errors.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run smoke
